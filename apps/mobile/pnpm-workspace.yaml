packages:
  - .

# Instalação achatada, sem os symlinks e sem o nível .pnpm/<pkg>@<versão>_<hash>/.
# Exigido pelo build nativo: react-native-screens e react-native-worklets
# compilam C++ via CMake/ninja, e no Windows o caminho real dos módulos sob o
# layout isolado passava de 170 caracteres antes mesmo de o CMake anexar
# android/.cxx/Debug/<hash>/<abi>/, estourando o MAX_PATH de 260 — o ninja
# falhava com "manifest 'build.ninja' still dirty after 100 tries".
# A doc do Expo também recomenda hoisted porque módulo nativo não pode ser
# duplicado: só uma versão dele é compilada por build.
nodeLinker: hoisted

allowBuilds:
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo@57.0.27
  - '@expo/ui@57.0.22'
  - expo-linking@57.0.12
  - expo-maps@57.0.4
  - expo-router@57.0.25
  - expo-sqlite@57.0.4
